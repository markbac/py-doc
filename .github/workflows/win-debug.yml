name: win-debug
on:
  push:
    branches: [consolidate-py-doc]
jobs:
  t:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -e ".[dev]"
      - shell: bash
        run: |
          python -m pytest -q --tb=short -p no:cacheprovider > out.txt 2>&1 || true
          python - <<'PY'
          import re
          for line in open("out.txt", encoding="utf-8", errors="replace"):
              if line.startswith(("FAILED", "E ", "ERROR")):
                  print("::error::" + line.strip()[:300])
          PY
