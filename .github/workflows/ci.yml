name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check .

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # The oldest and newest Python on Windows, where paths and line endings differ. macOS is not supported
          - {os: windows-latest, python-version: "3.10"}
          - {os: windows-latest, python-version: "3.14"}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Pandoc, XeLaTeX and Graphviz (the tests run them on the host in place of the container)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc texlive-xetex texlive-latex-recommended texlive-latex-extra texlive-plain-generic texlive-fonts-recommended fonts-crosextra-caladea fonts-crosextra-carlito graphviz
      - name: Vale (for the end-to-end test)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://github.com/errata-ai/vale/releases/download/v3.24.0/vale_3.24.0_Linux_64-bit.tar.gz | sudo tar -xz -C /usr/local/bin vale
      - name: Vale on Windows
        if: runner.os == 'Windows'
        run: choco install vale -y
      - run: python -m pip install -e ".[dev]"
      - name: Tests
        shell: bash
        run: |
          set +e
          python -m pytest -v -rf --tb=short > pytest.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E "^(FAILED|ERROR) " pytest.log | cut -c1-300 | awk '{ level = (NR <= 10) ? "error" : (NR <= 20) ? "warning" : "notice"; if (NR <= 30) print "::" level "::" $0 }'
          fi
          if [ $code -ne 0 ] && ! grep -qE "^(FAILED|ERROR) " pytest.log; then
            tail -12 pytest.log | cut -c1-300 | sed 's/^/::error::/'
          fi
          tail -5 pytest.log
          exit $code
      - name: Commands start
        run: |
          py-doc2docx --version
          py-doc2slides --version
          py-doclint --help
          py-doc --version
          py-doc docx --help
          py-doc slides --help
          py-doc lint --help
          py-doc build --help
          py-doc migrate --help
          py-doc template --help
          py-doc import --help
          py-doc c4 --help
          py-doc setup --help
          py-doc init --help
          py-doc site --help
          py-c4-exporter --help
      - name: py-doc's own documentation and the examples lint clean
        if: runner.os == 'Linux'
        run: |
          py-doc lint docs --strict
          cd examples && py-doc lint docs --strict

  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*

  gate:
    name: CI gate
    if: always()
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Require all jobs to succeed
        run: |
          echo '${{ toJSON(needs) }}'
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false" ]
