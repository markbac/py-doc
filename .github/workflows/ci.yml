name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Latest Python only, on both supported platforms. No macOS runners (cost)
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      # The packages are about 400 MB, and a slow Ubuntu mirror once took the job past its timeout downloading
      # them, so the .deb files are kept in the Actions cache. apt downloads only what has a newer version.
      - name: The packages for Pandoc, XeLaTeX and Graphviz, from the cache
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-${{ runner.os }}-
      - name: Pandoc, XeLaTeX and Graphviz (the tests run them on the host in place of the container)
        if: runner.os == 'Linux'
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Dir::Cache::Archives="$HOME/apt-archives" pandoc texlive-xetex texlive-latex-recommended texlive-latex-extra texlive-plain-generic texlive-fonts-recommended fonts-crosextra-caladea fonts-crosextra-carlito graphviz
          sudo rm -rf ~/apt-archives/partial ~/apt-archives/lock
          sudo chown -R "$USER" ~/apt-archives
      - name: Vale (for the end-to-end test)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://github.com/errata-ai/vale/releases/download/v3.24.0/vale_3.24.0_Linux_64-bit.tar.gz | sudo tar -xz -C /usr/local/bin vale
      - name: Vale on Windows
        if: runner.os == 'Windows'
        run: choco install vale -y
      - name: structurizr-cli (for the end-to-end C4 test; the runner has Java 17)
        if: runner.os == 'Linux'
        run: |
          line=$(awk '$1 == "structurizr-cli" { print $3 " " $4 }' src/py_doc/runtime/definition/tools.lock)
          curl -fsSL "${line% *}" -o /tmp/structurizr-cli.zip
          echo "${line#* }  /tmp/structurizr-cli.zip" | sha256sum -c -
          sudo unzip -q /tmp/structurizr-cli.zip -d /opt/structurizr-cli
          sudo chmod +x /opt/structurizr-cli/structurizr.sh
          echo "PY_DOC_STRUCTURIZR_CLI=/opt/structurizr-cli/structurizr.sh" >> "$GITHUB_ENV"
      - run: python -m pip install -e ".[dev]"
      - name: Tests
        shell: bash
        env:
          PY_DOC_BROWSER_TESTS: "1"  # the poster page tests run in the runner's Chrome, never skipped
        run: |
          set +e
          python -m pytest -v -rf --tb=short > pytest.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E "^(FAILED|ERROR) " pytest.log | cut -c1-300 | awk '{ level = (NR <= 10) ? "error" : (NR <= 20) ? "warning" : "notice"; if (NR <= 30) print "::" level "::" $0 }'
          fi
          if [ $code -ne 0 ] && ! grep -qE "^(FAILED|ERROR) " pytest.log; then
            tail -12 pytest.log | cut -c1-300 | sed 's/^/::error::/'
          fi
          tail -5 pytest.log
          exit $code
      - name: Commands start
        run: |
          py-doc2docx --version
          py-doc2slides --version
          py-doclint --help
          py-doc --version
          py-doc docx --help
          py-doc slides --help
          py-doc lint --help
          py-doc build --help
          py-doc migrate --help
          py-doc template --help
          py-doc import --help
          py-doc c4 --help
          py-doc setup --help
          py-doc init --help
          py-doc site --help
          py-c4-exporter --help
      - name: py-doc's own documentation and the examples lint clean
        if: runner.os == 'Linux'
        run: |
          py-doc lint docs --strict
          cd examples && py-doc lint docs poster --strict

  build:
    name: Build package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*

  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci --ignore-scripts  # the runner's own Node
      - run: npm run lint
      - run: npm test

  gate:
    name: CI gate
    if: always()
    needs: [lint, test, build, vscode]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require all jobs to succeed
        run: |
          echo '${{ toJSON(needs) }}'
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false" ]
