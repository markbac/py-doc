name: Pages

# Builds py-doc's own documentation site with py-doc (`py-doc site build`, MkDocs in the tool container) and
# publishes it to GitHub Pages. The diagram gallery draws the science fences too, so both images are needed. They
# are kept in the Actions cache, keyed on their definitions, so they are built again (5 to 40 minutes) only when
# a definition changes.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PY_DOC_CACHE: /tmp/py-doc-cache  # the diagrams already drawn, kept between runs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install -e .
      - name: The tool and science images, from the cache
        id: image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/py-doc-images.tar
          key: py-doc-images-${{ hashFiles('src/py_doc/runtime/definition/**', 'src/py_doc/runtime/science/**') }}
      - name: Load the images
        if: steps.image.outputs.cache-hit == 'true'
        run: docker load --input /tmp/py-doc-images.tar
      - name: Build the images
        if: steps.image.outputs.cache-hit != 'true'
        run: |
          py-doc tools build
          py-doc tools build --science
          docker save --output /tmp/py-doc-images.tar $(docker images --format '{{.Repository}}:{{.Tag}}' | grep -E '^py-doc-(tools|science):')
      - name: The diagrams drawn by the last run
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/py-doc-cache
          key: py-doc-diagrams-${{ github.sha }}
          restore-keys: py-doc-diagrams-
      - name: Build the site
        run: py-doc site build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/build

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
