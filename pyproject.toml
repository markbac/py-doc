[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "py-doc"
dynamic = ["version"]
description = "Markdown technical documentation to Word, PowerPoint, PDF and HTML, with a style linter"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mark Bacon" }]
keywords = ["markdown", "docx", "pptx", "pdf", "html", "pandoc", "documentation", "lint"]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Documentation",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "python-docx>=1.2.0",
    "markdown-it-py>=4.2.0",
    "mdit-py-plugins>=0.6.1",
    "python-pptx>=1.0.2",
    "Pillow>=12.3.0",
    "docxcompose>=2.2.0",
    "PyYAML>=6.0.3",
    "segno>=1.5",  # QR codes on posters; pure Python, no dependencies
    # Pinned to a commit because py-logkit has no tagged release yet. Move to the first tag when there is one.
    "ctxlogkit @ git+https://github.com/markbac/py-logkit@96453b403015ed762bcc5b3ffd5adbea3ef4fb0c",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.1",
    "build>=1.6.1",
    "twine>=7.0.0",
    "railroad-diagrams>=3.0.1",  # run by the railroad tool test
    "pypikchr>=0.2.0",  # run by the pikchr tool test
    "jsonschema>=4.26.0",  # checks the build report against its schema
    "playwright>=1.63.0",  # runs the poster page script in Chrome; no browser download
]

[project.scripts]
py-doc = "py_doc.app:run"
py-doc2docx = "py_doc.cli:main"
py-doc2slides = "py_doc.slides_cli:main"
py-doclint = "py_doc.lint.cli:main"
py-c4-exporter = "pyc4exporter.cli:main"

[tool.setuptools.dynamic]
version = {attr = "py_doc.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
py_doc = ["runtime/definition/*", "runtime/definition/extra-ca/*", "pandoc/resources/*", "diagrams/tools/*", "report.schema.json", "lint/examples/*", "lint/vale_styles/PyDoc/*", "lint/vale.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120

[tool.ruff]
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
