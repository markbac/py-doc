<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="Arial, sans-serif">
  <!-- The SN-100 board, top side, drawn to scale: 52 x 29 mm at 8 px a millimetre -->
  <rect x="40" y="20" width="416" height="232" rx="22" fill="#2f6b4a" stroke="#1f4a33" stroke-width="3"/>
  <circle cx="64" cy="44" r="7" fill="#d9d9d9" stroke="#8a8a8a" stroke-width="2"/>
  <circle cx="432" cy="44" r="7" fill="#d9d9d9" stroke="#8a8a8a" stroke-width="2"/>
  <circle cx="64" cy="228" r="7" fill="#d9d9d9" stroke="#8a8a8a" stroke-width="2"/>
  <circle cx="432" cy="228" r="7" fill="#d9d9d9" stroke="#8a8a8a" stroke-width="2"/>
  <!-- Traces -->
  <g fill="none" stroke="#8fc29f" stroke-width="3" opacity="0.8">
    <path d="M238 120 H246"/><path d="M286 112 H298"/><path d="M286 126 H298"/>
    <path d="M344 106 H352"/><path d="M344 120 H352"/><path d="M344 134 H352"/>
    <path d="M321 142 V196 H356"/><path d="M321 196 V226"/>
  </g>
  <!-- Coin cell holder, CR2477 (24.5 mm) -->
  <circle cx="140" cy="136" r="98" fill="#c9ccd1" stroke="#7d828a" stroke-width="3"/>
  <circle cx="140" cy="136" r="84" fill="#e3e5e8" stroke="#a5aab2" stroke-width="2"/>
  <text x="140" y="128" text-anchor="middle" font-size="22" font-weight="700" fill="#3b3f46">CR2477</text>
  <text x="140" y="152" text-anchor="middle" font-size="15" fill="#3b3f46">3 V, 1000 mAh</text>
  <text x="140" y="174" text-anchor="middle" font-size="22" fill="#3b3f46">+</text>
  <!-- Sensor with its vent -->
  <rect x="246" y="98" width="40" height="40" rx="4" fill="#3a3a3a"/>
  <circle cx="266" cy="118" r="7" fill="#9a9a9a"/>
  <text x="266" y="158" text-anchor="middle" font-size="13" fill="#ffffff">SHT-40</text>
  <!-- Microcontroller -->
  <rect x="298" y="96" width="46" height="46" rx="3" fill="#1e1e1e"/>
  <text x="321" y="124" text-anchor="middle" font-size="13" fill="#ffffff">MCU</text>
  <!-- Radio module and antenna -->
  <rect x="352" y="92" width="72" height="68" rx="4" fill="#b9bfc6" stroke="#6f767e" stroke-width="2"/>
  <text x="388" y="131" text-anchor="middle" font-size="13" fill="#2b2f35">Radio</text>
  <path d="M370 92 V72 H410 V60 H372 V48 H412" fill="none" stroke="#e0b44a" stroke-width="4"/>
  <!-- Programming pads and the join button -->
  <g fill="#e0b44a"><circle cx="250" cy="232" r="5"/><circle cx="266" cy="232" r="5"/><circle cx="282" cy="232" r="5"/><circle cx="298" cy="232" r="5"/></g>
  <text x="274" y="216" text-anchor="middle" font-size="11" fill="#ffffff">SWD</text>
  <rect x="356" y="188" width="44" height="34" rx="4" fill="#d9d9d9" stroke="#8a8a8a" stroke-width="2"/>
  <circle cx="378" cy="205" r="10" fill="#4a4f5c"/>
  <text x="378" y="240" text-anchor="middle" font-size="11" fill="#ffffff">JOIN</text>
  <!-- Dimensions -->
  <g stroke="#4a4f5c" stroke-width="1.5" fill="#4a4f5c" font-size="14">
    <path d="M40 274 H456"/><path d="M40 268 V280"/><path d="M456 268 V280"/>
    <text x="248" y="294" text-anchor="middle" stroke="none">52 mm</text>
    <path d="M482 20 V252"/><path d="M476 20 H488"/><path d="M476 252 H488"/>
    <text x="500" y="141" stroke="none">29 mm</text>
  </g>
</svg>
