  <rect x="0" y="0" width="300" height="40" fill="#c9d6d3"/>
  <path d="M0 40 H300" stroke="#4a5a5a" stroke-width="3"/>
  <rect x="60" y="40" width="56" height="36" rx="6" fill="#f4f8f7" stroke="#0f5e5e" stroke-width="3"/><circle cx="88" cy="58" r="5" fill="#e8684a"/>
  <rect x="200" y="40" width="70" height="14" fill="#fff6c9" stroke="#b38a1e" stroke-width="2"/>
