# markdownlint settings for `lint.markdownlint.config`.
default: true
MD013: false     # line length: sentences are written one per line or wrapped as the author likes
MD033: false     # raw HTML is allowed (it is kept in HTML output)
MD041: false     # a file may start without a first-line heading (front matter, includes)
MD007: {indent: 2}
MD029: {style: one}    # ordered lists use 1. throughout
