# The showcase posters: one made-up organisation each, with its own theme, colours, fonts and logo.
# py-doc poster builds them all into build/posters; py-doc poster iot-device builds one.
project:
  name: Poster showcase

poster:                  # every poster here
  fill: spread           # share any spare height in a column between its sections, so every column ends level
  paper: a1

posters:
  iot-device:
    source: iot-device.md
    output: build/posters/iot-device.html
    theme: brands/nimbus/theme.yml
    header: {align: left, logo: left}
    footer:
      left: Nimbus Air, product sheet PS-104
      right: nimbus.example/air
      qr: https://nimbus.example/air
      qr-label: Datasheet
  weather-station:
    source: weather-station.md
    output: build/posters/weather-station.html
    theme: brands/skyward/theme.yml
    header: {align: left, logo: left}
    footer:
      left: Skyward WS-7, Cairn Hill station
      right: Live data at skyward.example/cairn
      qr: https://skyward.example/cairn
      qr-label: Live readings
  quantum:
    source: quantum.md
    output: build/posters/quantum.html
    theme: brands/quanta/theme.yml
    footer:
      left: Quanta Institute public lectures
      right: Lecture 3 of 8
  hr-diagram:
