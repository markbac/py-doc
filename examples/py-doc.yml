# Example project for py-doc. Run `py-doc build` in this folder.
# Everything is checked when the file loads, so a typo is an error that names its place,
# such as `documents.guide.sources[1].page_brek`. Paths are relative to this file.

project:
  name: Sensor Node examples

# Defaults for every document. A document's own `outputs` override them.
outputs:
  docx:
    template: templates/sensor.docx    # `status: Draft` picks templates/sensor_Draft.docx when it exists
    dir: build
  pptx:
    template: templates/sensor.pptx    # `status: Draft` picks templates/sensor_Draft.pptx
    dir: build
  pdf:
    dir: build
  html:
    template: templates/doc.css        # for HTML the template is the stylesheet. `status: Draft` picks doc_Draft.css
    dir: build

documents:
  guide:
    # The guide joins the files below in order. The front matter of the first one gives the title,
    # subtitle, author, date, status, classification and document number.
    sources:
      - docs/guide/00_overview.md
      - docs/guide/01_requirements.md
      - file: docs/guide/02_design.md
        page_break: true               # start this file on a new page
      - docs/guide/03_operations.md
      - file: docs/guide/05_diagram_types.md   # one of every diagram type
        page_break: true
      - file: docs/guide/04_change_history.md
        heading_offset: 1              # shift every heading one level down (kept within 1 to 6)
        title: "Appendix: Change history"   # replaces the first heading of the file
        page_break: true
      - {file: docs/guide/DRAFT.md, include: false}   # listed, but no build uses it
    keywords: [IoT, sensor, MQTT]
    variables:                         # {{version}} and {{status_text}} in the Markdown
      version: "1.0"
      status_text: in service
    conditions:                        # [[IF: internal]] and [[IF: audience == staff]]
      internal: false
      audience: customer
    outputs:
      docx: {name: "{name}-v{version}", toc: true}    # build/guide-v1.0.docx, with a contents list
      pdf: {toc: true}                                # build/guide.pdf, made by XeLaTeX
      html: {toc: true}                               # build/guide.html, one self-contained file

  datasheet:
    # The same pipeline with every diagram type. Each type needs the tool container.
    sources: [docs/datasheet.md]
    variables: {version: "1.0"}
    outputs:
      docx:
        template: templates/datasheet.docx            # a template with its own placeholder style
        placeholder_prefix: "@@"                      # @@Title, @@Version ... instead of Replace-with-Title
        marker: "<<BODY>>"                            # where the body goes, instead of [[INSERTCONTENT]]
        name: "{name}-{version_safe}"                 # build/datasheet-1_0.docx
        # allow_missing_template: true                # warn and use a blank document if the template is missing
      pdf:
        toc: false                                    # no contents list
        template: templates/report.tex                # a LaTeX template with its own colours. `status: Draft` picks report_Draft.tex

  release-notes:
    # `version: git` is `git describe --tags --always` of this folder. Outside a repository, or
    # without a commit, the build fails instead of inventing a version.
    title: Sensor Node Release Notes
    author: A. Writer
    version: git
    sources: [docs/release-notes.md]
    outputs:
      docx: {name: "{name}-{version_safe}"}           # for example build/release-notes-v1_2_3.docx

  deck:
    sources: [docs/deck/slides.md]
    variables: {version: "1.0"}        # {{version}} in the slides and in the footer pattern
    conditions: {internal: false}      # the [[IF: internal]] slide is left out
    outputs:
      pptx:
        split_level: 2                 # a new slide at each heading up to level 2
        footer: "{title} v{version}"   # fills the footer of every slide

  interfaces:
    # API specifications kept in their own files and included with [[INCLUDE-CODE:]],
    # with a PlantUML use case diagram.
    sources: [docs/interfaces.md]
    outputs:
      docx: {toc: true}                               # build/interfaces.docx
      html: {toc: true}                               # build/interfaces.html

  architecture:
    # Chapters generated from a Structurizr workspace, between hand-written ones.
    # workspace.json needs no Java. To start from the DSL, name architecture/workspace.dsl instead:
    # it is converted by structurizr-cli in the tool container, and the result is cached.
    title: Sensor Node Architecture
    author: A. Writer
    version: "1.0"
    status: Draft
    document_number: SN-AD-001
    sources:
      - docs/includes/audience.md
      - structurizr: architecture/workspace.json
        levels: [context, containers, components, relationships, deployment]
        heading_offset: 1
        # `browser` draws each view with Structurizr Local and headless Chromium, so the views look as
        # they do in Structurizr. `source` needs architecture/workspace.dsl: structurizr-cli writes
        # PlantUML or Mermaid text (`format: plantuml`), and that is drawn like any other diagram.
        # Both need Docker.
        diagrams: {engine: browser, format: png}
    outputs:
      docx: {}
      html: {}

  api-reference:
    # The reference documentation of the library's REST and event APIs, written by the generators below
    # from docs/includes/apis/. py-doc build runs them first; `py-doc generate` runs them on their own.
    title: Library API Reference
    version: "1.0"
    status: Draft
    sources:
      - build/generated/rest-api.md
      - {file: build/generated/events-api.md, page_break: true}
    outputs:
      docx: {toc: true}                               # build/api-reference.docx
      html: {toc: true}                               # build/api-reference.html

# Content generators: Markdown made from other sources before the build. The API ones run Redocly and
# Widdershins (OpenAPI) and the AsyncAPI generator in the tool container, and also write their HTML pages.
content:
  generators:
    - type: openapi
      source: docs/includes/apis/library-openapi.yaml
      output: build/generated/rest-api.md
      title: REST API
      html: build/api/rest-api.html                   # a Redoc page
    - type: asyncapi
      source: docs/includes/apis/library-asyncapi.yaml
      output: build/generated/events-api.md
      title: Event API
      html: build/api/events-api.html                 # an AsyncAPI page

# Mermaid settings for every Mermaid diagram: documents, the site and the posters. A diagram's own
# front matter wins, key by key.
diagrams:
  mermaid:
    sequence: {showSequenceNumbers: true}

# Structurizr Local, started on a private Docker network for the `browser` engine.
# `py-doc c4 lock` pins the image by digest in c4-images.lock.
c4:
  port: 8080

# A JSON report of every build: tools and versions, sources, outputs with SHA-256, diagrams.
reports:
  path: build/report.json

lint:
  exclude: [build]
  rules:
    DOC003: info                       # error, warning, info or off
    C4004: off                         # a model element without relationships
  glossary:                            # the canonical spelling, then the wrong ones
    MQTT: [mqtt, Mqtt]
    TLS: [tls]
    BLE: [ble]
    OTA: [ota]
    I2C: [i2c]
  phrases:                             # a wordy phrase and what to write instead
    utilise: use
  acronyms:
    min_length: 3
    allowed: [SBOM]
  structure: structure-rules.yaml      # project conventions as data
  # markdownlint runs in the tool container, only when this is set. Uncomment it once Docker works:
  # markdownlint:
  #   config: .markdownlint.yaml         # a file, or the settings written here as a mapping
  #   severity: warning
  vale:
    enabled: auto                      # runs when Vale is installed
    spelling: en-GB
    rules_file: vale-rules.yml
    packages: []                       # for example [write-good], then `py-doc lint --sync`
    ignore: ["build/**"]

# A web site of the documents: `py-doc site init` makes site/ once, `py-doc site build` fills and builds it.
# Each source file becomes a page, in a folder per document. mkdocs.yml in site/ is yours to change.
site:
  engine: mkdocs                       # or starlight (Astro + Starlight)
  dir: site
  documents: [guide, datasheet, architecture]
  posters: [sensor-node, commissioning, release, reliability]   # each a page of the site, and a Posters page

# Posters for `py-doc poster`: one self-contained HTML page each. `py-doc poster` builds them all,
# `py-doc poster commissioning` one. Settings in layers: `poster` (every poster), then the front matter
# of the Markdown file, then the poster's own entry here, then the command line.
poster:
  footer:
    centre: Example Instruments
posters:
  sensor-node:
    source: poster/poster.md       # every setting is in its front matter
  commissioning:
    source: poster/landscape.md    # its front matter has the words and the layout; the company's look is set here
    output: build/posters/commissioning.html
    pdf: true                      # and build/posters/commissioning.pdf, one A1 landscape page
    theme: poster/brand/example-instruments.yml
    colours:
      accent: "#d9573a"             # one colour changed over the theme
    header: {align: left, logo: left}
    embed_fonts: [latin]           # the brand's web fonts inside the page, Latin letters only
    footer:
      left: SN-100 commissioning
      right: Field guide FG-012, revision B
      logos: [poster/brand/partner.svg]
      qr: https://example.com/commissioning
      qr-label: The full checklist
  release:
    source: poster/release.md
    variables: {version: "2.1"}
  reliability:
    source: poster/reliability.md  # the print theme, three columns on A0, and a version from Git
    conditions: {internal: true}   # over the front matter's false: with the costs and customer names
  plots:
    source: poster/plots.md        # every plot preset: Pareto, control chart, distributions, curves, hierarchies
  shapes:
    source: poster/shapes.md       # every shape block: pyramids, rings, cutaways, memory maps and more
  embedded:
    source: poster/embedded.md     # the protocol and embedded blocks: pins, bus captures, bytes and code
  scales:
    source: poster/scales.md       # every scale block: thresholds, a waterfall, buckets, dials and spectra
  diagrams:
    source: poster/diagrams.md     # one small example of every diagram the tool container draws, in the poster's theme

